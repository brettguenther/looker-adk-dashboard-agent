[project]
name = "looker-dashboard-agent"
version = "0.1.0"
description = "Looker LookML Dashboard Agent for Gemini Enterprise powered by Google ADK"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.149.0",
    "google-adk[gcp,otel-gcp]>=2.7.1",
    "a2a-sdk[http-server]>=0.3.0",
    "sse-starlette>=2.1.0",
    "google-genai>=2.19.0",
    "looker-sdk>=26.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "google-auth>=2.20.0",
    "rich>=13.7.0",
    "cloudpickle>=3.0.0",
    "uvicorn>=0.30.0",
    "fastapi>=0.110.0",
    "google-cloud-logging>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
